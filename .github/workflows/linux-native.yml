name: Linux native

# The no-Nix Ubuntu build documented in README "Without Nix": the system
# toolchain plus AMD's ROCm apt repository, producing x86-64 release binaries
# with gfx1151 HIP kernels. The ROCm userspace runtime is bundled into the
# release tree (tools/ci/bundle_rocm_runtime.py), so deployment machines only
# need the amdgpu kernel driver. The hosted runner has no AMD GPU, so the job
# verifies configure, build, install and the platform smoke checks; GPU
# diagnostics stay on the Devlab runners. Like windows.yml, Toolboxes also
# calls this workflow to package an exact release tag. A manual dispatch of
# an exact tag additionally publishes the archive to a release on the
# repository where the run happens.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Upstream release tag to build (e.g. v0.24.0; empty builds the current ref)'
        required: false
        type: string
  workflow_call:
    inputs:
      release-tag:
        description: Exact Gufo release tag to build for Toolboxes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-native-${{ inputs.release-tag || github.ref }}
  cancel-in-progress: ${{ !inputs.release-tag }}

jobs:
  build:
    name: Ubuntu native build (no Nix)
    # Forks that track upstream sync this file without running it; automatic
    # builds only make sense in the org repos where releases are packaged. A
    # manual dispatch stays available everywhere so a fork can build an
    # upstream release tag on demand.
    if: >-
      github.repository == 'gufo-org/gufo' ||
      github.repository == 'gufo-org/toolboxes' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ inputs.release-tag && format('linux-release-{0}-{1}', inputs.release-tag, github.run_attempt) || 'gufo-linux-x86_64' }}
    timeout-minutes: 90
    env:
      CCACHE_DIR: /tmp/gufo-ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      CCACHE_NOHASHDIR: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A reusable workflow otherwise checks out its caller (Toolboxes).
          repository: ${{ inputs.release-tag && 'gufo-org/gufo' || github.repository }}
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.ref }}

      - name: Compute CMake compiler cache key
        id: ccache-key
        run: echo "epoch-week=$(( $(date -u +%s) / 604800 ))" >> "$GITHUB_OUTPUT"

      - name: Restore CMake compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/gufo-ccache
          key: gufo-native-ccache-v1-${{ runner.os }}-${{ steps.ccache-key.outputs.epoch-week }}
          restore-keys: |
            gufo-native-ccache-v1-${{ runner.os }}-

      # AMD's ROCm apt repository ships the gfx1151 TheRock packages the dev
      # boxes use (amdrocm-*); the key must match /etc/apt/keyrings/amdrocm.gpg.
      - name: Add the AMD ROCm apt repository
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://stable.repo.amd.com/rocm/gpg/packages.gpg \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/amdrocm.gpg > /dev/null
          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/amdrocm.sources > /dev/null
          Types: deb
          URIs: https://stable.repo.amd.com/rocm/core/packages/ubuntu2404/
          Suites: stable
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/amdrocm.gpg
          EOF

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake ninja-build patchelf pkg-config \
            libicu-dev libcurl4-openssl-dev libssl-dev libpng-dev libjpeg-dev \
            libwebp-dev ffmpeg \
            amdrocm-core10.0-gfx1151 amdrocm-runtime-dev10.0 amdrocm-llvm10.0 \
            amdrocm-blas-dev10.0 amdrocm-hipblas-common-dev10.0 \
            amdrocm-blas10.0-gfx1151 amdrocm-ccl-dev10.0

      - name: Prepare CMake compiler cache
        run: |
          mkdir -p /tmp/gufo-ccache
          chmod -R a+rwX /tmp/gufo-ccache
          ccache --zero-stats

      - name: Identify release source
        if: inputs.release-tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version=$(tr -d '\r\n' < version.txt)
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo 'tag and version.txt disagree' >&2
            exit 1
          fi
          revision=$(git rev-parse HEAD)
          {
            echo "GUFO_RELEASE_VERSION=$version"
            echo "GUFO_REVISION=$revision"
          } >> "$GITHUB_ENV"

      # The /opt/rocm rpath only seeds resolution on the build host; the
      # bundle step below repoints the installed RUNPATH at the bundled
      # runtime. The prefix is fixed at configure time because the
      # gufo-server symlink install rule expands it there (cmake --install
      # --prefix would not move it). The ROCm Clang is pinned so compiler
      # discovery cannot pick the runner's system Clang; CMake attaches
      # ccache to C and C++ itself (CMakeLists.txt) and HIP joins like the
      # production Nix package.
      - name: Configure
        run: |
          identity=()
          if [[ -n "${GUFO_RELEASE_VERSION:-}" ]]; then
            identity+=("-DGUFO_RELEASE_VERSION=$GUFO_RELEASE_VERSION" "-DGUFO_REVISION=$GUFO_REVISION")
          else
            identity+=("-DGUFO_REVISION=$(git rev-parse --short HEAD)")
          fi
          cmake --preset release "${identity[@]}" \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DCMAKE_HIP_COMPILER_LAUNCHER=/usr/bin/ccache \
            -DCMAKE_INSTALL_RPATH="/opt/rocm/lib" \
            -DCMAKE_INSTALL_PREFIX="$PWD/install/gufo"

      - name: Build
        run: |
          cmake --build --preset release --parallel "$(nproc)"
          ccache --show-stats

      - name: Install
        run: cmake --install build/release

      # A release-tag build checks out the upstream tag, whose tree does not
      # carry this workflow's bundling script; fetch it from the workflow's
      # own commit instead.
      - name: Checkout the workflow commit
        if: inputs.release-tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: workflow-source

      - name: Bundle the ROCm userspace runtime
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          script=tools/ci/bundle_rocm_runtime.py
          if [[ -n "$RELEASE_TAG" ]]; then
            script=workflow-source/tools/ci/bundle_rocm_runtime.py
          fi
          python3 "$script" --install install/gufo

      # With /opt/rocm hidden, only the bundled runtime can satisfy the
      # binary; this proves the deployment requirement is the kernel driver.
      - name: Smoke check the bundle without a system ROCm
        run: |
          set -euo pipefail
          restore_rocm() {
            if [[ -d /opt/rocm.hidden ]]; then
              sudo mv /opt/rocm.hidden /opt/rocm
            fi
          }
          trap restore_rocm EXIT
          sudo mv /opt/rocm /opt/rocm.hidden
          ./install/gufo/bin/gufo --version
          ./install/gufo/bin/gufo-server --version
          if [[ -n "${GUFO_RELEASE_VERSION:-}" ]]; then
            expected="gufo version $GUFO_RELEASE_VERSION ($GUFO_REVISION)"
            actual="$(./install/gufo/bin/gufo --version)"
            if [[ "$actual" != "$expected" ]]; then
              echo "release reports '$actual', expected '$expected'" >&2
              exit 1
            fi
          fi
          # The hosted runner has no AMD GPU: only the platform section can
          # pass here; full diagnosis needs the device.
          ./install/gufo/bin/gufo diagnose --section platform

      - name: Pack the release tree
        env:
          ARCHIVE_STEM: ${{ inputs.release-tag && format('gufo-{0}-linux-x86_64', inputs.release-tag) || 'gufo-linux-x86_64' }}
        run: |
          tar -czf "$ARCHIVE_STEM.tar.gz" -C install gufo
          sha256sum "$ARCHIVE_STEM.tar.gz" > "$ARCHIVE_STEM.tar.gz.sha256"

      - name: Upload the binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.release-tag && format('linux-release-{0}-{1}', inputs.release-tag, github.run_attempt) || 'gufo-linux-x86_64' }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the release archive
    needs: build
    # Only a manual dispatch of an exact tag publishes, and only on the
    # repository where the run happens. The Toolboxes workflow_call path must
    # not create releases: attaching official assets stays with the
    # Toolboxes orchestrator.
    if: inputs.release-tag != '' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - name: Publish to the repository release
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file=$(mktemp)
          {
            echo "Linux x86-64 native build of the upstream \`$RELEASE_TAG\` tag"
            echo "(no Nix, gfx1151 HIP kernels; bundles the AMD ROCm 10.0 userspace"
            echo "runtime — only the amdgpu kernel driver is required, with read"
            echo "access to /dev/kfd and /dev/dri)."
            echo
            echo "Non-ROCm shared libraries come from the base distribution. Minimal"
            echo "systems need libcurl4, libicu74, libpng16-16, libjpeg-turbo8,"
            echo "libwebp7, libsndfile1, libsoxr0, libssl3 and libgomp1; ffmpeg is"
            echo "optional and only used for video and audio output."
            echo
            if ! body=$(gh release view "$RELEASE_TAG" --repo gufo-org/gufo --json body -q .body 2>/dev/null); then
              body=''
            fi
            if [[ -n "$body" ]]; then
              echo "## Upstream release notes"
              echo
              echo "$body"
            fi
          } > "$notes_file"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "gufo $RELEASE_TAG (Linux x86-64)" \
              --notes-file "$notes_file"
          fi
